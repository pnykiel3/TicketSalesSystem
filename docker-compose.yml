version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: tickethub_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tickethub2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticket_db}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-tickethub2026}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tickethub-network

  # Backend API
  backend:
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    image: pnykiel3/tickethub-backend:latest
    container_name: tickethub_backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-tickethub2026}
      DB_NAME: ${DB_NAME:-ticket_db}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tickethub-network

  # Frontend (Nginx)
  frontend:
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    image: pnykiel3/tickethub-frontend:latest
    container_name: tickethub_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tickethub-network

volumes:
  mysql-data:
    driver: local

networks:
  tickethub-network:
    driver: bridge
